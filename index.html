<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locktober</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">🎩 Locktober</h1>
      <p class="subtitle">Upload your photo and try on the Locktober hat ✨</p>
    </header>

    <div id="drop-area" class="drop-area">
      <p>Drag & Drop an image or click to upload</p>
      <input type="file" id="fileElem" accept="image/*" hidden />
    </div>

    <div id="canvas-container" class="canvas-container">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Scale</label>
        <input id="scaleRange" type="range" min="0.2" max="2" step="0.01" value="1">
      </div>
      <div class="control-group">
        <label>Rotate</label>
        <input id="rotateRange" type="range" min="-180" max="180" step="1" value="0">
      </div>
      <div class="buttons">
        <button id="resetBtn" class="btn secondary">Reset</button>
        <button id="saveBtn" class="btn primary">Save</button>
      </div>
    </div>

    <footer class="footer">Made with ❤️ for Locktober</footer>
  </div>
</body>
</html>
